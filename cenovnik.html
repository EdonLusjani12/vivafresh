<!DOCTYPE html>

<head>

  <link rel="icon" href="Logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <img src="Logo.png" alt="Viva Fresh">
        <span>Viva Fresh<span class="brand-mk"> MK</span></span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Мени"><i class="fas fa-bars"></i></button>
      <nav class="nav" id="nav">
        <a href="index.html">Дома</a>
        <a href="katalog.html">Каталог</a>
        <a class="active" href="cenovnik.html">Ценовници</a>
        <a href="kontakt.html">Контакт</a>
        <a href="vrabotuvanje.html">Вработување</a>
        <a href="toogoodtogo1.php">Too Good To Go</a>
        <div class="nav-social">
          <a href="https://www.instagram.com/vivafreshmk/" target="_blank" rel="noopener"><i class="fab fa-instagram"></i></a>
          <a href="https://www.facebook.com/freshstoremk" target="_blank" rel="noopener"><i class="fab fa-facebook-f"></i></a>
        </div>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="page-hero">
      <span class="kicker">Цени</span>
      <h1>Ценовници по <em>маркет</em></h1>
      <p>Изберете маркет за да ги видите производите и промоциите.</p>
    </section>

    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="marketSearch" placeholder="Пребарај по град или име...">
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Сите</button>
      <button class="filter-btn" data-filter="super">Hyper</button>
      <button class="filter-btn" data-filter="regular">Маркет</button>
    </div>

    <div class="market-buttons-grid" id="marketsContainer"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap copy">© 2026 Viva Fresh Store MK</div>
  </footer>
  <script src="js/site.js"></script>
  <script>
    const markets = [
      { number: 1, name: "Вива Фреш", type: "super", city: "Скопје" },
      { number: 2, name: "Вива Фреш", type: "regular", city: "Скопје" }
    ];
    const typeNames = { super: "VivaFresh Hyper", regular: "Маркет" };

    function generateMarketCard(market) {
      return `
        <div class="market-card">
          <div class="market-header">
            <div class="market-number">${market.number}</div>
            <span class="market-type ${market.type}">${typeNames[market.type]}</span>
          </div>
          <h3 class="market-name">${market.name}</h3>
          <div class="market-location"><i class="fas fa-map-marker-alt"></i> ${market.city}</div>
          <button class="view-table-btn" onclick="window.open('table.php?market=market${market.number}', '_blank', 'width=1200,height=800')">
            Види ценовник
          </button>
        </div>`;
    }

    function renderMarkets(filterType = "all", searchTerm = "") {
      const container = document.getElementById("marketsContainer");
      let list = markets;
      if (filterType !== "all") list = list.filter((m) => m.type === filterType);
      if (searchTerm) {
        const term = searchTerm.toLowerCase();
        list = list.filter((m) => m.name.toLowerCase().includes(term) || m.city.toLowerCase().includes(term));
      }
      container.innerHTML = list.map(generateMarketCard).join("") || '<p class="card">Нема резултати.</p>';
    }

    document.addEventListener("DOMContentLoaded", function () {
      renderMarkets();
      const searchInput = document.getElementById("marketSearch");
      searchInput.addEventListener("input", function () {
        const active = document.querySelector(".filter-btn.active");
        renderMarkets(active ? active.dataset.filter : "all", this.value);
      });
      document.querySelectorAll(".filter-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
          this.classList.add("active");
          renderMarkets(this.dataset.filter, searchInput.value);
        });
      });
    });
  </script>
</body>
</html>
