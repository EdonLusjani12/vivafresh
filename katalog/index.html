      opacity: 0;
    }

      transform: rotateY(0deg);
      opacity: 1;
    }
    
    .turning-prev #current-page {
      transform: rotateY(180deg);
      opacity: 0;
    }

      transform: rotateY(0deg);
      opacity: 1;
    }

  <script>
    const url = 'katalog kitgo 29.05-04.06 fb.pdf';
    let pdfDoc = null;
    let pageNum = 1;
    let isAnimating = false;

  
    pdfjsLib.getDocument(url).promise.then(function(pdf) {
      pdfDoc = pdf;
      document.getElementById('page-count').textContent = pdf.numPages;
      renderPage(pageNum, 'current-page');
    });

  
    function renderPage(num, canvasId) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      
      pdfDoc.getPage(num).then(function(page) {
        const viewport = page.getViewport({ scale: 1.5 });
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        
        page.render({
          canvasContext: ctx,
          viewport: viewport
        });
      });
    }

 
    document.getElementById('next-page').addEventListener('click', function() {
      if (isAnimating || pageNum >= pdfDoc.numPages) return;
      
      isAnimating = true;
      document.getElementById('pdf-wrapper').classList.add('turning-next');
      
   
      renderPage(pageNum + 1, 'next-page');
      
   
      setTimeout(function() {
        pageNum++;
        document.getElementById('page-num').textContent = pageNum;
        

        renderPage(pageNum, 'current-page');
        document.getElementById('pdf-wrapper').classList.remove('turning-next');
        isAnimating = false;
      }, 800);
    });

    document.getElementById('prev-page').addEventListener('click', function() {
      if (isAnimating || pageNum <= 1) return;
      
      isAnimating = true;
      document.getElementById('pdf-wrapper').classList.add('turning-prev');
      
   
      renderPage(pageNum - 1, 'next-page');
      
    
      setTimeout(function() {
        pageNum--;
        document.getElementById('page-num').textContent = pageNum;
      
        renderPage(pageNum, 'current-page');
        document.getElementById('pdf-wrapper').classList.remove('turning-prev');
        isAnimating = false;
      }, 800);
    });

    </script>
